<!DOCTYPE html>
<html lang="zh-Hant">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>NOXVAULT // Secure Intelligence Hub</title>

<style>
:root{
  --bg:#040404;
  --card:#0b0b0b;
  --line:#151515;
  --green:#00ff9d;
  --green2:#00c97d;
  --red:#ff4040;
  --orange:#ff9f43;
  --yellow:#ffd32a;
  --blue:#34ace0;
  --text:#d7d7d7;
  --muted:#6d6d6d;
}

*{
  margin:0;
  padding:0;
  box-sizing:border-box;
  font-family:Consolas,"Noto Sans TC",monospace;
}

body{
  background:
  linear-gradient(rgba(0,255,157,.03) 1px, transparent 1px),
  linear-gradient(90deg, rgba(0,255,157,.03) 1px, transparent 1px),
  var(--bg);
  background-size:40px 40px;
  color:var(--text);
  overflow-x:hidden;
}

header{
  position:sticky;
  top:0;
  z-index:999;
  background:rgba(0,0,0,.93);
  border-bottom:1px solid var(--line);
  backdrop-filter:blur(10px);
}

.topbar{
  max-width:1800px;
  margin:auto;
  padding:16px 18px;
  display:flex;
  justify-content:space-between;
  align-items:center;
  gap:18px;
}

.logo{
  display:flex;
  align-items:center;
  gap:14px;
}

.logo-box{
  width:38px;
  height:38px;
  border:2px solid var(--green);
  display:flex;
  align-items:center;
  justify-content:center;
}

.logo-box::after{
  content:"";
  width:9px;
  height:9px;
  background:var(--green);
  transform:rotate(45deg);
}

.logo h1{
  font-size:24px;
  letter-spacing:3px;
}

.logo span{
  color:var(--green);
}

.btn{
  border:1px solid var(--green);
  color:var(--green);
  background:transparent;
  padding:10px 16px;
  font-size:12px;
  cursor:pointer;
  text-decoration:none;
  transition:.2s;
  display:inline-flex;
  align-items:center;
  justify-content:center;
}

.btn:hover{
  background:rgba(0,255,157,.08);
  box-shadow:0 0 18px rgba(0,255,157,.08);
}

nav{
  max-width:1800px;
  margin:auto;
  padding:0 18px 14px;
  display:flex;
  gap:10px;
  overflow-x:auto;
}

.nav-btn{
  border:1px solid #1a1a1a;
  color:#777;
  background:transparent;
  padding:10px 16px;
  cursor:pointer;
  font-size:12px;
  white-space:nowrap;
}

.nav-btn.active,
.nav-btn:hover{
  border-color:var(--green);
  color:var(--green);
}

.container{
  max-width:1800px;
  margin:auto;
  padding:28px 18px 100px;
}

.section{
  display:none;
}

.section.active{
  display:block;
}

.section-title{
  color:#757575;
  margin-bottom:22px;
  letter-spacing:2px;
  font-size:18px;
}

.grid{
  display:grid;
  grid-template-columns:repeat(auto-fit,minmax(360px,1fr));
  gap:18px;
}

.card{
  background:linear-gradient(180deg,rgba(0,255,157,.015),transparent),rgba(0,0,0,.55);
  border:1px solid #111;
  border-left:3px solid var(--green);
  padding:18px;
  transition:.22s;
  display:flex;
  flex-direction:column;
}

.card:hover{
  transform:translateY(-2px);
  box-shadow:0 0 20px rgba(0,255,157,.08);
}

.card h3{
  color:var(--green);
  font-size:16px;
  line-height:1.6;
  margin-bottom:14px;
}

.card p{
  font-size:12px;
  line-height:1.8;
  color:#d3d3d3;
  word-break:break-word;
  white-space:pre-line;
}

.meta{
  color:#666;
  font-size:10px;
  line-height:1.7;
  margin-bottom:12px;
}

.news-top{
  display:flex;
  justify-content:space-between;
  align-items:center;
  gap:12px;
  margin-bottom:14px;
}

.news-level{
  padding:5px 8px;
  border:1px solid;
  font-size:10px;
}

.divider{
  width:100%;
  height:1px;
  background:#151515;
  margin:18px 0;
}

.card-actions{
  display:flex;
  gap:10px;
  flex-wrap:wrap;
  margin-top:auto;
  padding-top:18px;
}

.system-tag{
  border:1px solid #202020;
  color:#b8b8b8;
  padding:7px 10px;
  font-size:10px;
}

.loading{
  border:1px solid var(--green);
  color:var(--green);
  padding:18px;
  font-size:12px;
}

footer{
  border-top:1px solid #111;
  color:#666;
  text-align:center;
  padding:24px;
  font-size:10px;
}

@media(max-width:900px){
  .grid{
    grid-template-columns:1fr;
  }
}

@media(max-width:700px){
  .topbar{
    flex-direction:column;
    align-items:flex-start;
  }

  .logo h1{
    font-size:20px;
  }

  .card{
    padding:16px;
  }

  .btn{
    width:100%;
  }
}
</style>
</head>
<body>

<header>
  <div class="topbar">
    <div class="logo">
      <div class="logo-box"></div>
      <h1>Nox<span>Vault</span></h1>
    </div>

    <a href="https://gc-apps-tw.github.io/NoxVault" class="btn">
      返回主掃描器
    </a>
  </div>

  <nav>
    <button class="nav-btn active" onclick="switchPage('news',this)">
      資安情報
    </button>

    <button class="nav-btn" onclick="switchPage('knowledge',this)">
      防毒知識
    </button>

    <button class="nav-btn" onclick="switchPage('antivirus',this)">
      防毒軟體
    </button>
  </nav>
</header>

<div class="container">

<section class="section active" id="news">
  <div class="section-title">
    // 即時威脅情報流
  </div>

  <div class="grid" id="news-container">
    <div class="loading">
      >>> INITIALIZING THREAT GATEWAY...
    </div>
  </div>
</section>

<section class="section" id="knowledge">
  <div class="section-title">
    // 50 個生活防毒知識
  </div>

  <div class="grid" id="knowledge-list"></div>
</section>

<section class="section" id="antivirus">
  <div class="section-title">
    // 20 個防毒軟體介紹
  </div>

  <div class="grid" id="antivirus-list"></div>
</section>

</div>

<footer>
NOXVAULT THREAT INTELLIGENCE NETWORK
</footer>

<script>

function switchPage(id,btn){

  document.querySelectorAll('.section')
  .forEach(v=>v.classList.remove('active'));

  document.querySelectorAll('.nav-btn')
  .forEach(v=>v.classList.remove('active'));

  document.getElementById(id)
  .classList.add('active');

  btn.classList.add('active');
}

const RSS_API =
"https://YOUR-HF-SPACE.hf.space/api/news";

async function loadNews(){

  const container =
  document.getElementById('news-container');

  try{

    const response = await fetch(RSS_API);
    const payload = await response.json();

    container.innerHTML =
    payload.data.map(item=>`

      <div class="card">

        <div class="news-top">

          <div class="news-level"
               style="
               color:${item.color};
               border-color:${item.color};
               ">

            ${item.level}

          </div>

          <div class="meta">
            ${item.category}
          </div>

        </div>

        <h3>
          ${item.title}
        </h3>

        <p>
          ${item.summary}
        </p>

        <div class="divider"></div>

        <div class="meta">
          SOURCE // ${item.source}
          <br>
          PUBLISHED // ${item.published}
        </div>

        <div class="card-actions">

          <a href="${item.link}"
             target="_blank"
             class="btn">

             查看原始情報

          </a>

        </div>

      </div>

    `).join('');

  }catch(err){

    container.innerHTML = `

      <div class="card">

        <h3 style="color:var(--red);">
          RSS GATEWAY FAILED
        </h3>

        <p>
無法連線至外部威脅情報節點。

ERROR:
${err.message}
        </p>

      </div>

    `;
  }
}

const knowledgeTitles = [
"不要下載來源不明 APK",
"啟用雙重驗證",
"公共 Wi‑Fi 避免登入銀行",
"不要重複使用密碼",
"定期更新系統",
"不要隨意點擊 Email 附件",
"確認網址是否為官方域名",
"避免使用弱密碼",
"不要關閉防火牆",
"下載軟體前先確認來源",
"不要在陌生網站輸入信用卡",
"瀏覽器擴充功能不要亂裝",
"避免破解軟體",
"手機不要 Root",
"Windows 不要長期停留舊版本",
"定期備份重要資料",
"不要在社群公開個資",
"關閉不必要的藍牙",
"不要掃描來源不明 QR Code",
"VPN 不代表完全匿名",
"定期檢查登入紀錄",
"不要將密碼存在記事本",
"雲端硬碟也需要雙重驗證",
"USB 隨身碟先掃毒",
"不要關閉 Windows Defender",
"使用密碼管理器",
"避免下載破解版遊戲",
"避免點擊短網址",
"Email 驗證寄件者",
"不要把驗證碼給別人",
"社群帳號要綁定信箱",
"不要安裝來路不明插件",
"不要開啟巨集文件",
"避免使用過期軟體",
"遠端桌面需限制存取",
"關閉自動下載",
"檢查 App 權限",
"不要把主密碼告訴別人",
"定期更換高風險帳號密碼",
"企業裝置不要混用私人用途",
"確認 HTTPS 憑證",
"避免假客服詐騙",
"下載檔案先檢查副檔名",
"不要關閉手機更新",
"避免登入釣魚網站",
"社群私訊連結需警惕",
"停用不必要的帳號",
"避免使用公共充電站",
"不要在論壇公開 Email",
"定期檢查裝置異常流量"
];

const knowledgeData = knowledgeTitles.map((title,index)=>({
  title,
  desc:`
${title} 是日常資安防護中非常重要的一環。

許多攻擊者並不會直接破解系統，
而是利用使用者的習慣、疏忽與缺乏警覺性進行入侵。

實際攻擊可能包含：

• 惡意程式散播
• 帳號盜用
• 釣魚網站
• 驗證碼攔截
• Cookie 竊取
• 遠端控制
• 資料外洩

正確的做法包括：

• 確認來源可信度
• 啟用額外驗證
• 定期更新裝置
• 使用防毒與防火牆
• 檢查異常登入紀錄
• 不隨意提供敏感資訊

當長期維持良好的資安習慣時，
能大幅降低遭受惡意攻擊、帳號接管與資料外洩的風險。
  `
}));

const antivirusNames = [
"Bitdefender",
"ESET NOD32",
"Malwarebytes",
"Kaspersky",
"Norton",
"McAfee",
"Avast",
"AVG",
"Trend Micro",
"Sophos",
"CrowdStrike",
"SentinelOne",
"Microsoft Defender",
"Avira",
"Panda Security",
"F‑Secure",
"Comodo",
"Webroot",
"ZoneAlarm",
"ClamAV"
];

const antivirusData = antivirusNames.map(name=>({
  name,
  desc:`
${name} 是全球知名的資安與端點防護解決方案之一。

該產品長期被企業、教育單位與一般使用者廣泛使用，
並在多個 AV 測試平台中具有穩定表現。

核心能力通常包括：

• 即時威脅偵測
• AI 行為分析
• 勒索軟體防護
• 網頁惡意連結阻擋
• USB 裝置掃描
• 雲端威脅分析
• 系統漏洞檢查
• 隱私與網路保護

適合的使用情境包含：

• 個人電腦
• 遊戲裝置
• 商業環境
• 遠端辦公
• 學校裝置
• 企業端點防護

若搭配良好的使用習慣與定期更新，
能有效降低惡意程式、勒索軟體與帳號竊取風險。
  `,
  systems:["Windows","macOS","Android","iOS"],
  url:`https://www.google.com/search?q=${encodeURIComponent(name+' official')}`
}));

document.getElementById('knowledge-list')
.innerHTML =
knowledgeData.map((item,index)=>`

<div class="card">

  <div class="meta">
    SECURITY KNOWLEDGE // ${String(index+1).padStart(2,'0')}
  </div>

  <h3>
    ${item.title}
  </h3>

  <p>
    ${item.desc}
  </p>

</div>

`).join('');

document.getElementById('antivirus-list')
.innerHTML =
antivirusData.map((item,index)=>`

<div class="card">

  <div class="meta">
    SECURITY SOFTWARE PROFILE // ${String(index+1).padStart(2,'0')}
  </div>

  <h3>
    ${item.name}
  </h3>

  <p>
    ${item.desc}
  </p>

  <div class="divider"></div>

  <div class="card-actions">

    ${item.systems.map(v=>`
      <div class="system-tag">${v}</div>
    `).join('')}

  </div>

  <div class="card-actions">

    <a href="${item.url}"
       target="_blank"
       class="btn">

       官方網站

    </a>

  </div>

</div>

`).join('');

window.addEventListener(
'DOMContentLoaded',
loadNews
);

</script>

</body>
</html>
